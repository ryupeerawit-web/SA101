version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fitness_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fitness_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fitness_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com # อีเมลสำหรับ Login เข้า pgAdmin
      PGADMIN_DEFAULT_PASSWORD: rootpassword # รหัสผ่านสำหรับ Login เข้า pgAdmin
    ports:
      - "8081:80" # เปิด Web UI บน Port 8081 (http://localhost:8081)
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: # Volume สำหรับเก็บข้อมูลการตั้งค่าของ pgAdmin