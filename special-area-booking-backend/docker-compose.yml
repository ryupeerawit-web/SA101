services:
  postgres:
    image: postgres:16-alpine
    container_name: special-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: special_booking
      TZ: Asia/Bangkok
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d special_booking"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: special-booking-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports: ["5050:80"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    container_name: special-booking-api
    restart: unless-stopped
    env_file: [.env]
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  postgres_data: